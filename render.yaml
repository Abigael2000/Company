databases:
  - name: northbridge-db
    plan: free
    databaseName: northbridge
    user: northbridge

services:
  - type: web
    name: northbridge-site
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: northbridge-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "0"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: COMPANY_EMAIL
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
