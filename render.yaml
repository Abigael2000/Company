databases:
  - name: jadas-db
    plan: free
    databaseName: jadas
    user: jadas

services:
  - type: web
    name: jadas-sas
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: ADMIN_PASSWORD
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: jadas-db
          property: connectionString

      - key: FLASK_DEBUG
        value: "0"

      - key: SMTP_HOST
        value: smtp.zoho.com

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: COMPANY_EMAIL
        sync: false

      - key: WHATSAPP_NUMBER
        sync: false
